# Which dependencies may run install scripts. pnpm blocks them all by default.
#
# pnpm still prints "Ignored build scripts: @scarf/scarf, esbuild" on every install.
# That notice is expected and harmless — pnpm 10.33 offers no setting to hide it:
#   - esbuild ships its binary as a platform package (@esbuild/<platform>), so its script is redundant
#   - @scarf/scarf (pulled in by swagger-ui-dist) is analytics/telemetry we don't want to run
allowBuilds:
  # Prisma needs its scripts: they install the schema engine used by migrations.
  "@prisma/engines": true
  prisma: true
  esbuild: false
  "@scarf/scarf": false

# Security patches for transitive dependencies whose parent packages have not released
# a fixed version yet. Re-check these on every dependency bump and delete the entries
# that are no longer needed: `pnpm audit` should stay clean without them.
#   qs, body-parser, path-to-regexp  -> pulled in by express 5.2.1 (already the latest release)
#   mysql2, deepmerge-ts             -> pulled in by the prisma CLI, which the app never calls at runtime
overrides:
  qs: ">=6.16.0"
  body-parser: ">=2.3.0"
  path-to-regexp: ">=8.4.2"
  mysql2: ">=3.24.4"
  deepmerge-ts: ">=8.0.2"
  esbuild: ">=0.28.1"
