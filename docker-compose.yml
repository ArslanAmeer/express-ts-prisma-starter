# Local PostgreSQL for development and tests. Start it with `pnpm db:up`.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep their data under /var/lib/postgresql/<major>/docker
      - postgres-data:/var/lib/postgresql
      # Runs once, on the very first start: creates the separate `app_test` database used by `pnpm test`
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
